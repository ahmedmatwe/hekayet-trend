name: comments
on:
  schedule: [{ cron: '23 * * * *' }]   # كل ساعة
  workflow_dispatch:
concurrency: { group: comments, cancel-in-progress: false }
permissions: { contents: write }
# الكود والبيانات في الريبو الخاص hekayet-trend-core (بمفتاح CORE_DEPLOY_KEY)، والتشغيل والفيديوهات هنا
env: { GH_REPO: ahmedmatwe/hekayet-trend }
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { repository: ahmedmatwe/hekayet-trend-core, ssh-key: '${{ secrets.CORE_DEPLOY_KEY }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: الرد على الكومنتات
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/comments.mjs
      - run: |
          git config user.name "hekayet-trend-bot"; git config user.email "bot@users.noreply.github.com"
          git add data; git diff --cached --quiet || (git commit -m "ردود الكومنتات" && git pull --rebase -q && git push)
