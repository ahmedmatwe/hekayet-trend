name: publish
on:
  schedule: [{ cron: '7,37 * * * *' }]
  workflow_dispatch:
concurrency: { group: publish, cancel-in-progress: false }
permissions: { contents: write }
# الكود والبيانات في الريبو الخاص hekayet-trend-core (بمفتاح CORE_DEPLOY_KEY)، والتشغيل والفيديوهات هنا
env: { GH_REPO: ahmedmatwe/hekayet-trend }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { repository: ahmedmatwe/hekayet-trend-core, ssh-key: '${{ secrets.CORE_DEPLOY_KEY }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: نشر اللي عليه الدور
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node scripts/cloud-publish.mjs
      - name: حفظ حالة الطابور والسجل
        if: always()
        run: |
          git config user.name "hekayet-trend-bot"; git config user.email "bot@users.noreply.github.com"
          git add queue data || true
          git diff --cached --quiet && exit 0
          git commit -m "نشر: تحديث الطابور"
          # المصنع بيرفع في نفس الوقت: لازم الحالة تتحفظ وإلا الفيديو يتنشر تاني
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep $((i*5)); done; exit 1
